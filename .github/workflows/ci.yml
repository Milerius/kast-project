name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with: { version: 9.12.0 }
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:property
      - run: pnpm test:bdd
      # Next.js 15.5 statically prerenders /_not-found, which boots the
      # Privy provider and reads NEXT_PUBLIC_PRIVY_APP_ID. Supply dummy values
      # so the production build (which runs without a real `.env.local`) can
      # complete — these never reach runtime since the compiled bundle just
      # needs SOMETHING to satisfy the `required()` guard at module eval.
      - run: pnpm build
        env:
          # Privy validates the app-ID format at provider init (25-char id
          # starting with "cl"). Use a well-formed fake so prerender succeeds;
          # real value is injected at runtime.
          NEXT_PUBLIC_PRIVY_APP_ID: clpkcicicicicicicicicicici
          NEXT_PUBLIC_SOLANA_RPC_URL: https://ci.invalid
          NEXT_PUBLIC_BASE_RPC_URL: https://ci.invalid
